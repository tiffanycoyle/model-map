name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job needs to read the repo and publish a Pages artifact,
# and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued run supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate data
        run: node src/validate.mjs

      # Must run before the build: it resolves the site's real origin, which the
      # build needs for canonical URLs and sitemap.xml.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node src/build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
